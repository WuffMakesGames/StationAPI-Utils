template: blockmodel
textures: [ "texture" ]
assets:
  blockstates/$id.json: '{
      "generated": "$gen",
      "variants": { "": { "model": "$namespace:block/$id" } }
    }'
  models/item/$id.json: '{
      "generated": "$gen",
      "parent": "$namespace:block/$id"
    }'
  models/block/$id.json: '{
      "generated": "$gen",
      "parent": "$namespace:base/crop",
      "textures": { "texture": "$tex_texture" }
    }'